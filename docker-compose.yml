version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=port_number
      - DB_NAME=db_name
      - DB_USER=postgres
      - DB_PASSWORD=password
      - PORT=5000

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
