apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      imagePullSecrets:
        - name: harbor-secret

      containers:
        - name: frontend
          image: 192.168.72.131/devops2/frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80
